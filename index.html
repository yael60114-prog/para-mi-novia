<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mariana ❤️</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial,sans-serif;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

#slider{
position:relative;
width:90%;
max-width:400px;
height:80vh;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 30px red;
}

#slider img{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
animation:slide 45s infinite;
}

#mensaje{
position:absolute;
bottom:15px;
left:10px;
right:10px;
background:rgba(0,0,0,.55);
padding:15px;
border-radius:15px;
font-size:20px;
text-align:center;
}

@keyframes slide{
0%{opacity:0;}
3%{opacity:1;}
8%{opacity:1;}
11%{opacity:0;}
100%{opacity:0;}
}

.rosa{
position:absolute;
top:-50px;
font-size:28px;
animation:caer linear infinite;
}

@keyframes caer{
to{
transform:translateY(110vh) rotate(360deg);
}
}

.hello{
position:absolute;
top:10px;
right:10px;
font-size:45px;
animation:latir 2s infinite;
}

@keyframes latir{
50%{
transform:scale(1.2);
}
}
</style>

</head>
<body>

<div class="hello">🎀</div>

<div id="slider">

<img src="assets/IMG_5402.jpeg" style="animation-delay:0s">
<img src="assets/IMG_6139.png" style="animation-delay:3s">
<img src="assets/IMG_6145.png" style="animation-delay:6s">

<div id="mensaje">
🌹 Mariana ❤️<br><br>
Aunque la distancia nos separe, mi corazón siempre está contigo.<br><br>
Gracias por existir.<br><br>
Feliz Día de la Novia. ❤️<br><br>
Con amor,<br>
Yael.
</div>

</div>

<script>

for(let i=0;i<40;i++){

let r=document.createElement("div");

r.className="rosa";

r.innerHTML="🌹";

r.style.left=Math.random()*100+"vw";

r.style.animationDuration=(5+Math.random()*6)+"s";

r.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(r);

}

</script>

</body>
</html>
