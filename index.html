
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
}

.carta{
position:absolute;
background:rgba(0,0,0,.55);
padding:25px;
border-radius:20px;
color:white;
text-align:center;
max-width:330px;
backdrop-filter:blur(5px);
}

h1{
color:#ff4d6d;
font-size:32px;
margin-bottom:10px;
}

p{
font-size:18px;
line-height:1.6;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
<source src="video.mp4" type="video/mp4">
</video>

<div class="carta">
<h1>🐱🖤</h1>

<p>
Para la niña más bonita.<br><br>

Cada segundo contigo vale más que cualquier cosa.
No importa cuánto pase el tiempo, siempre habrá una razón para sonreír si estás tú.
</p>

<button onclick="alert('Te amo muchísimo ❤️🌹')">
Tócame
</button>

</div>

</body>
</html>
